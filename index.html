<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>محل عاصمة الربيع للخيام</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: #0a0805;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Amiri', serif;
    padding: 20px;
    position: relative;
    overflow: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: 
      repeating-linear-gradient(45deg, rgba(201,169,110,0.03) 0px, rgba(201,169,110,0.03) 1px, transparent 1px, transparent 40px),
      repeating-linear-gradient(-45deg, rgba(201,169,110,0.03) 0px, rgba(201,169,110,0.03) 1px, transparent 1px, transparent 40px);
    pointer-events: none;
  }
  .card {
    width: 100%;
    max-width: 420px;
    position: relative;
    animation: fadeIn 0.8s ease forwards;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .top-band {
    height: 5px;
    background: linear-gradient(90deg, #5a3a10, #C9A96E, #f0d090, #C9A96E, #5a3a10);
    border-radius: 4px 4px 0 0;
  }
  .card-inner {
    background: linear-gradient(160deg, #130f09 0%, #0d0b08 60%, #1a1208 100%);
    border: 1px solid rgba(201,169,110,0.25);
    border-top: none;
    border-radius: 0 0 16px 16px;
    padding: 32px 28px 28px;
    position: relative;
    overflow: hidden;
  }
  .card-inner::before {
    content: '';
    position: absolute;
    top: -60px; left: 50%;
    transform: translateX(-50%);
    width: 300px; height: 200px;
    background: radial-gradient(ellipse, rgba(201,169,110,0.08) 0%, transparent 70%);
    pointer-events: none;
  }
  .corners { position: absolute; inset: 12px; pointer-events: none; }
  .corners::before, .corners::after, .corners span::before, .corners span::after {
    content: '';
    position: absolute;
    width: 16px; height: 16px;
    border-color: rgba(201,169,110,0.4);
    border-style: solid;
  }
  .corners::before { top:0; left:0; border-width: 1px 0 0 1px; }
  .corners::after  { top:0; right:0; border-width: 1px 1px 0 0; }
  .corners span::before { bottom:0; left:0; border-width: 0 0 1px 1px; }
  .corners span::after  { bottom:0; right:0; border-width: 0 1px 1px 0; }
  .star-ornament { text-align: center; margin-bottom: 6px; }
  .star-ornament svg { width: 36px; height: 36px; animation: spin-slow 20s linear infinite; }
  @keyframes spin-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .shop-name-ar {
    text-align: center;
    font-family: 'Amiri', serif;
    font-size: 26px;
    font-weight: 700;
    color: #C9A96E;
    line-height: 1.4;
    margin-bottom: 4px;
    text-shadow: 0 2px 20px rgba(201,169,110,0.3);
  }
  .shop-name-en {
    text-align: center;
    font-family: 'Cormorant Garamond', serif;
    font-size: 12px;
    letter-spacing: 4px;
    color: rgba(201,169,110,0.55);
    text-transform: uppercase;
    margin-bottom: 6px;
    direction: ltr;
  }
  .divider { display: flex; align-items: center; gap: 10px; margin: 14px 0; }
  .divider-line { flex: 1; height: 1px; background: linear-gradient(90deg, transparent, rgba(201,169,110,0.4), transparent); }
  .divider-diamond { width: 6px; height: 6px; background: #C9A96E; transform: rotate(45deg); flex-shrink: 0; }
  .links-grid { display: flex; flex-direction: column; gap: 10px; }
  .link-btn {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 18px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(201,169,110,0.15);
    border-radius: 10px;
    text-decoration: none;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
    direction: ltr;
  }
  .link-btn::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--accent);
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  .link-btn:hover { background: rgba(201,169,110,0.06); border-color: rgba(201,169,110,0.35); transform: translateX(4px); }
  .link-btn:hover::before { opacity: 1; }
  .btn-icon {
    width: 40px; height: 40px;
    border-radius: 10px;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .btn-icon svg { width: 20px; height: 20px; }
  .btn-text { flex: 1; }
  .btn-label { font-family: 'Cormorant Garamond', serif; font-size: 15px; font-weight: 600; color: rgba(255,255,255,0.85); letter-spacing: 1px; display: block; }
  .btn-sub { font-family: 'Cormorant Garamond', serif; font-size: 11px; color: rgba(255,255,255,0.35); letter-spacing: 1px; }
  .btn-arrow { color: rgba(201,169,110,0.4); font-size: 16px; transition: transform 0.3s; }
  .link-btn:hover .btn-arrow { transform: translateX(4px); color: #C9A96E; }
  .btn-tiktok { --accent: rgba(255,0,80,0.1); }
  .btn-tiktok .btn-icon { background: linear-gradient(135deg, #010101, #69c9d0); }
  .btn-instagram { --accent: rgba(225,48,108,0.1); }
  .btn-instagram .btn-icon { background: linear-gradient(135deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
  .bottom-band { height: 5px; background: linear-gradient(90deg, #5a3a10, #C9A96E, #f0d090, #C9A96E, #5a3a10); border-radius: 0 0 4px 4px; }
  .footer-text { text-align: center; margin-top: 16px; font-family: 'Cormorant Garamond', serif; font-size: 11px; color: rgba(201,169,110,0.3); letter-spacing: 2px; direction: ltr; }
  .qr-hint { text-align: center; margin-top: 10px; font-family: 'Cormorant Garamond', serif; font-size: 11px; color: rgba(255,255,255,0.2); letter-spacing: 1px; direction: ltr; }
</style>
</head>
